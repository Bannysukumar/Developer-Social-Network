spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

server:
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      protocol-header: X-Forwarded-Proto
      remote-ip-header: X-Forwarded-For

logging:
  level:
    root: INFO
    com.devconnect.socialnetwork: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.springframework.data.mongodb: WARN
    org.mongodb: WARN

management:
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  password:
    memory-kb: 65536
    iterations: 3
  security:
    trust-proxy: ${TRUST_PROXY:true}
  mail:
    host: ${MAIL_HOST:}
    public-app-url: ${APP_PUBLIC_URL}
