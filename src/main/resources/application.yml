spring:
  application:
    name: social-network-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  data:
    mongodb:
      auto-index-creation: true
    redis:
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

server:
  port: ${SERVER_PORT:8080}
  server-header: ""
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
    accesslog:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include:
            - readinessState
            - mongo
            - rateLimitStore
  health:
    redis:
      enabled: false
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    enabled: ${APP_SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${APP_SWAGGER_ENABLED:true}
    path: /swagger-ui.html

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-not-for-production-32b}
    issuer: devconnect-social-network
    audience: devconnect-clients
    access-token-ttl: ${JWT_ACCESS_EXPIRATION:15m}
    refresh-token-ttl: ${JWT_REFRESH_EXPIRATION:7d}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
  password:
    salt-length: 16
    hash-length: 32
    parallelism: 1
    memory-kb: 16384
    iterations: 2
  rate-limit:
    enabled: true
    store: ${RATE_LIMIT_STORE:memory}
    signup-per-hour: 5
    login-per-fifteen-minutes: 10
    forgot-password-per-hour: 5
    reset-password-per-hour: 10
    verify-email-per-hour: 10
    resend-verification-per-hour: 5
    search-per-minute: 30
    friend-request-per-hour: 20
    message-per-minute: 60
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:noreply@example.com}
    public-app-url: ${APP_PUBLIC_URL:http://localhost:3000}
    smtp-auth: true
    starttls: true
  storage:
    location: ${UPLOAD_DIR:./uploads}
    max-image-bytes: 2097152
  security:
    trust-proxy: ${TRUST_PROXY:false}
    require-email-verified: ${REQUIRE_EMAIL_VERIFIED:false}
    max-request-bytes: 1048576
  redis-url: ${REDIS_URL:redis://localhost:6379}
